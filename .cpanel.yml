---
deployment:
  tasks:
    # Main Laravel app folder (outside public_html)
    - export APPPATH=/home/kmcserver/laravelapp
    - export PUBLICPATH=/home/kmcserver/public_html

    # Copy project to laravelapp
    - find $APPPATH -mindepth 1 -maxdepth 1 ! -name ".env" ! -name "vendor" ! -name "node_modules" -exec rm -rf {} \;

    - /bin/mkdir -p $APPPATH
    - tar -cf - --exclude='.env' --exclude='storage' --exclude='vendor' . | (cd $APPPATH && tar -xf -)

    # Install PHP dependencies
    - cd $APPPATH
    - /usr/local/bin/composer install --no-interaction --prefer-dist --optimize-autoloader

    # Install Node dependencies and build assets
    - /usr/local/bin/npm install || npm install
    - /usr/local/bin/npm run build || npm run build

    # Clear public_html and recreate
    - /bin/rm -rf $PUBLICPATH/*
    - /bin/mkdir -p $PUBLICPATH

    # Copy public folder contents into public_html
    - /bin/cp -R $APPPATH/public/* $PUBLICPATH/

    #keep only manifest.json in public/build folder
    - find $APPPATH/public -mindepth 1 -maxdepth 1 ! -name "build" -exec rm -rf {} \;
    - find $APPPATH/public/build -type f ! -name "manifest.json" -delete

    # Permissions
    - /bin/chmod -R 775 $APPPATH/storage $APPPATH/bootstrap/cache

    # Fix index.php
    - /bin/sed -i "s|__DIR__.'/../vendor/autoload.php'|__DIR__.'/../laravelapp/vendor/autoload.php'|g" $PUBLICPATH/index.php
    - /bin/sed -i "s|__DIR__.'/../bootstrap/app.php'|__DIR__.'/../laravelapp/bootstrap/app.php'|g" $PUBLICPATH/index.php

    # Laravel cache optimize
    - cd $APPPATH
    - /usr/local/bin/php artisan config:clear
    - /usr/local/bin/php artisan cache:clear
    - /usr/local/bin/php artisan route:clear
    - /usr/local/bin/php artisan view:clear
    - /usr/local/bin/php artisan config:cache
    - /usr/local/bin/php artisan route:cache
    - /usr/local/bin/php artisan view:cache

    # Storage link inside public_html
    - /usr/local/bin/php artisan storage:link
